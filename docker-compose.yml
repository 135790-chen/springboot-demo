services:
  # ========== 基础设施 ==========
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: demo-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    volumes:
      - nacos-data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: demo-zipkin
    ports:
      - "9411:9411"

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: demo-sentinel
    ports:
      - "8858:8858"
    environment:
      SERVER_PORT: 8858
      AUTH_USERNAME: sentinel
      AUTH_PASSWORD: sentinel

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: demo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: demo-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards/jvm-micrometer.json:/var/lib/grafana/dashboards/jvm-micrometer.json:ro
    depends_on:
      - prometheus

  # ========== 应用服务 ==========
  auth-service:
    build: ./auth-service
    container_name: demo-auth
    ports:
      - "8081:8081"
    environment:
      NACOS_SERVICE_HOST: nacos
      DB_HOST: mysql
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

  student-service:
    build: ./student-service
    container_name: demo-student
    ports:
      - "8082:8082"
    environment:
      NACOS_SERVICE_HOST: nacos
      DB_HOST: mysql
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: demo-gateway
    ports:
      - "8080:8080"
    environment:
      NACOS_SERVICE_HOST: nacos
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      nacos:
        condition: service_started

  message-service:
    build: ./message-service
    container_name: demo-message
    ports:
      - "8083:8083"
    environment:
      NACOS_SERVICE_HOST: nacos
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      nacos:
        condition: service_started

  organization-service:
    build: ./organization-service
    container_name: demo-organization
    ports:
      - "8084:8084"
    environment:
      NACOS_SERVICE_HOST: nacos
      DB_HOST: mysql
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

  teaching-service:
    build: ./teaching-service
    container_name: demo-teaching
    ports:
      - "8085:8085"
    environment:
      NACOS_SERVICE_HOST: nacos
      DB_HOST: mysql
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

  statistics-service:
    build: ./statistics-service
    container_name: demo-statistics
    ports:
      - "8086:8086"
    environment:
      NACOS_SERVICE_HOST: nacos
      DB_HOST: mysql
      REDIS_HOST: redis
      ZIPKIN_HOST: zipkin
      SENTINEL_DASHBOARD_HOST: sentinel-dashboard
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  nacos-data:
