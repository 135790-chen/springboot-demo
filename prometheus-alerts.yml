# ===================================================
# Prometheus 告警规则
# ===================================================
groups:
  - name: spring-boot-alerts
    rules:
      # --- 服务存活 ---
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 服务宕机"
          description: "服务 {{ $labels.service }} 已停止响应超过 1 分钟"

      # --- JVM 堆内存 > 90% ---
      - alert: HighJvmMemory
        expr: sum(jvm_memory_used_bytes{area="heap"}) by (service) / sum(jvm_memory_max_bytes{area="heap"}) by (service) > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} JVM 堆内存使用率 > 90%"
          description: "当前使用率 {{ $value | humanizePercentage }}"

      # --- CPU 使用率 > 80% ---
      - alert: HighCpuUsage
        expr: rate(process_cpu_usage[1m]) * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} CPU 使用率 > 80%"
          description: "当前 CPU 使用率 {{ $value | humanize }}%"

      # --- HTTP 500 错误率 > 5% ---
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{status=~"5.."}[2m])
          / rate(http_server_requests_seconds_count[2m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率 > 5%"
          description: "近 2 分钟 5xx 错误占比 {{ $value | humanizePercentage }}"

      # --- 接口响应 P99 > 2s ---
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[3m]))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} P99 延迟 > 2s"
          description: "{{ $labels.method }} {{ $labels.uri }} P99 延迟 {{ $value }}s"
